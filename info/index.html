<script>
  function getOrdinalSuffix(day) {
    if (day >= 11 && day <= 13) return 'th';
    switch (day % 10) {
      case 1: return 'st';
      case 2: return 'nd';
      case 3: return 'rd';
      default: return 'th';
    }
  }

  function displayCurrentDateTime() {
    const now = new Date();
    const day = now.getDate();
    const ordinal = getOrdinalSuffix(day);

    const dateOptions = {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      timeZone: 'Pacific/Auckland'
    };
    const timeOptions = {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false, 
      timeZone: 'Pacific/Auckland'
    };

   
    let formattedDate = now.toLocaleDateString('en-NZ', dateOptions);
    formattedDate = formattedDate.replace(
      day,
      `${day}<sup>${ordinal}</sup>`
    );

    const formattedTime = now.toLocaleTimeString('en-NZ', timeOptions);

    document.getElementById('currentDateTime').innerHTML = `${formattedDate}. ${formattedTime} NZT`;
  }

  displayCurrentDateTime();
  setInterval(displayCurrentDateTime, 1000);
</script>
